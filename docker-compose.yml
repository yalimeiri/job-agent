services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobagent
      POSTGRES_PASSWORD: jobagent
      POSTGRES_DB: jobagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobagent"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://jobagent:jobagent@postgres:5432/jobagent?sslmode=disable"
      RAPIDAPI_KEY: "${RAPIDAPI_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID}"
    volumes:
      # Mount your real config and CV (kept out of the image).
      - ./config.yaml:/app/config.yaml:ro
      - ./assets:/app/assets:ro
      - ./screenshots:/app/screenshots

volumes:
  pgdata:
